name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Build & Test (Xcode)
    runs-on: macos-15

    steps:
      - name: Checkout cashly
        uses: actions/checkout@v4
        with:
          path: cashly

      # Prism is consumed as `../../prism` from CashlyKit/Package.swift.
      # Layout on the runner: $GITHUB_WORKSPACE/cashly + $GITHUB_WORKSPACE/prism
      - name: Checkout prism (sibling for SPM local path)
        uses: actions/checkout@v4
        with:
          repository: rafaelesantos/prism
          path: prism

      - name: Select latest Xcode
        run: |
          XCODE=$(ls /Applications | grep -E '^Xcode[_-]?[12][0-9]|^Xcode\.app' | sort -V | tail -1)
          echo "Using Xcode: $XCODE"
          sudo xcode-select -s "/Applications/$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Install xcbeautify
        run: brew install xcbeautify

      - name: Cache SPM artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
            cashly/CashlyKit/.build
          key: spm-${{ runner.os }}-${{ hashFiles('cashly/CashlyKit/Package.swift') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: List schemes
        working-directory: cashly/Cashly
        run: xcodebuild -project Cashly.xcodeproj -list

      - name: Build app (Production)
        working-directory: cashly/Cashly
        run: |
          set -o pipefail
          xcodebuild build \
            -project Cashly.xcodeproj \
            -scheme Production \
            -destination 'generic/platform=iOS Simulator' \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions

      - name: Run CashlyKit tests
        working-directory: cashly/CashlyKit
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme CashlyKit-Package \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
            -enableCodeCoverage YES \
            -resultBundlePath TestResults.xcresult \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions

      - name: Coverage summary
        working-directory: cashly/CashlyKit
        if: always()
        run: |
          if [ -d TestResults.xcresult ]; then
            xcrun xccov view --report --only-targets TestResults.xcresult || true
          fi

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: cashly/CashlyKit/TestResults.xcresult
          retention-days: 7

      # Snapshot suite writes failure artifacts (`.failure-N.png` and
      # diff PNGs) into the test bundle when a screenshot diverges.
      # Uploading them lets reviewers eyeball regressions without
      # re-running locally.
      - name: Upload snapshot failure artifacts
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: snapshot-failures
          path: |
            cashly/CashlyKit/Tests/CashlyTests/Snapshots/__Snapshots__/**/*.failure-*.png
            cashly/CashlyKit/Tests/CashlyTests/Snapshots/__Snapshots__/**/*.png
          retention-days: 7
          if-no-files-found: ignore
