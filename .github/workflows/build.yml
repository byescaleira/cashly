name: Build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  lint:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v6
      - name: Check formatting and SwiftLint
        run: scripts/lint.sh --reporter github-actions-logging
  compile:
    needs: lint
    runs-on: xcode-27
    strategy:
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v6
      - name: Check Xcode 27
        run: xcodebuild -version
      - name: Compile iOS, macOS and visionOS
        run: scripts/build.sh "${{ matrix.configuration }}"
  test:
    needs: lint
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v6
      - name: Run tests
        run: scripts/test.sh
